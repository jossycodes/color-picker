<!-- /color-picker/index.html-->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Color Genie</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">
    <header class="topbar">
      <span class="brand">Color Genie</span>
      <button id="theme-toggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </header>

    <main class="card">
      <div class="box">
        <canvas id="canvas"></canvas>
        <div id="canvas2"></div>
      </div>

      <div id="controls">
        <div class="col">
          <input id="depth" type="range" step="0.1" min="0" max="100" value="50">
        </div>
        <div class="col">
          <div class="item item-swatch">
            <div id="main"></div>
          </div>
          <div class="item item-code">
            <input id="code" type="text" value="#FFFFFF" spellcheck="false" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="col">
        <div id="type" role="button" tabindex="0">single</div>
      </div>

      <div id="plates"></div>
    </main>

    <footer class="footer">Color Genie</footer>
  </div>

  <!-- custom dialog-->
  <div id="dialog" class="hide">
    <ul>
      <li data-name="single" class="list-item">Single</li>
      <li data-name="complimentary" class="list-item">Complimentary</li>
      <li data-name="monochromic" class="list-item">Monochromic</li>
      <li data-name="analogous" class="list-item">Analogous</li>
      <li data-name="triadic" class="list-item">Triadic</li>
      <li data-name="tedradic" class="list-item">Tedradic</li>
    </ul>
  </div>

  <script type="module" src="color.js"></script>
</body>

</html>
